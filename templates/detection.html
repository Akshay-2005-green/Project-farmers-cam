{% extends "base.html" %}

{% block title %}
Crop Disease Detection
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-5">

            <h2 class="text-center text-success mb-5">
                <i class="fa-solid fa-leaf me-2"></i>
                Crop Disease Detection
            </h2>

            <form action="{{ url_for('predict') }}"
                  method="POST"
                  enctype="multipart/form-data">

                <!-- Hidden File Input -->

                <input
                    type="file"
                    id="imageInput"
                    name="image"
                    accept="image/*"
                    hidden
                    onchange="previewImage(event)">

                <!-- Buttons -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <button
                            type="button"
                            class="btn btn-success w-100 p-4"
                            onclick="openGallery()">

                            <i class="fa-solid fa-image fa-3x"></i>

                            <br><br>

                            <h5>Select Image</h5>

                        </button>

                    </div>

                    <div class="col-md-6 mb-3">

                        <button
                            type="button"
                            class="btn btn-primary w-100 p-4"
                            onclick="openCamera()">

                            <i class="fa-solid fa-camera fa-3x"></i>

                            <br><br>

                            <h5>Take Photo</h5>

                        </button>

                    </div>

                </div>

                <hr class="my-4">

                <!-- Preview -->

                <div class="text-center">

                    <img
                        id="preview"
                        src="{{ url_for('static', filename='images/upload.png') }}"
                        class="img-thumbnail rounded shadow"
                        style="max-width:300px; max-height:300px;">

                    <p
                        id="fileName"
                        class="mt-3 text-muted">

                        No image selected

                    </p>

                </div>

                <div class="text-center mt-4">

                    <button
                        type="submit"
                        class="btn btn-success btn-lg px-5">

                        <i class="fa-solid fa-magnifying-glass me-2"></i>

                        Detect Disease

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

function openGallery()
{
    const input = document.getElementById("imageInput");

    input.removeAttribute("capture");

    input.click();
}

function openCamera()
{
    const input = document.getElementById("imageInput");

    input.setAttribute("capture","environment");

    input.click();
}

function previewImage(event)
{
    const file = event.target.files[0];

    if(file)
    {
        document.getElementById("preview").src =
            URL.createObjectURL(file);

        document.getElementById("fileName").innerHTML =
            "<strong>Selected File:</strong> " + file.name;
    }
}

</script>

{% endblock %}
