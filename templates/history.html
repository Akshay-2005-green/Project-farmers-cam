{% extends "base.html" %}

{% block title %}
Detection History
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">
                Detection History
            </h3>
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-success">

                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Crop</th>
                        <th>Disease</th>
                        <th>Confidence</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>1</td>

                        <td>
                            <img src="{{ url_for('static', filename='images/tomato.jpg') }}"
                                 width="80"
                                 class="rounded">
                        </td>

                        <td>Tomato</td>

                        <td class="text-danger">
                            Late Blight
                        </td>

                        <td>98.7%</td>

                        <td>29-06-2026</td>

                        <td>

                            <button class="btn btn-primary btn-sm">
                                View
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>2</td>

                        <td>
                            <img src="{{ url_for('static', filename='images/corn.jpg') }}"
                                 width="80"
                                 class="rounded">
                        </td>

                        <td>Corn</td>

                        <td class="text-warning">
                            Common Rust
                        </td>

                        <td>95.2%</td>

                        <td>28-06-2026</td>

                        <td>

                            <button class="btn btn-primary btn-sm">
                                View
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>3</td>

                        <td>
                            <img src="{{ url_for('static', filename='images/potato.jpg') }}"
                                 width="80"
                                 class="rounded">
                        </td>

                        <td>Potato</td>

                        <td class="text-danger">
                            Early Blight
                        </td>

                        <td>97.8%</td>

                        <td>27-06-2026</td>

                        <td>

                            <button class="btn btn-primary btn-sm">
                                View
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
