<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FarmersCam</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#eef8ee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#198754;
        }

        .navbar-brand{
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .navbar-brand:hover{
            color:white;
        }

        .register-card{

            margin-top:60px;

            border:none;

            border-radius:15px;

            box-shadow:0px 5px 20px rgba(0,0,0,.15);

        }

        .card-header{

            background:#198754;

            color:white;

            text-align:center;

            font-size:25px;

            font-weight:bold;

            border-radius:15px 15px 0 0;

        }

        .btn-success{

            width:100%;

            font-size:18px;

        }

        footer{

            background:#198754;

            color:white;

            text-align:center;

            margin-top:50px;

            padding:15px;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-leaf"></i>
                FarmersCam
            </a>

        </div>

    </nav>

    <!-- Registration Form -->

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card register-card">

                    <div class="card-header">

                        Create Account

                    </div>

                    <div class="card-body p-4">

                        <form action="{{ url_for('register') }}" method="POST">

                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter Full Name"
                                    required>

                            </div>

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter Email"
                                    required>

                            </div>

                            <!-- Mobile -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Mobile Number

                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="Enter Mobile Number"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required>

                            </div>

                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    placeholder="Confirm Password"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success">

                                Register

                            </button>

                        </form>

                        <hr>

                        <div class="text-center">

                            Already have an account?

                            <a href="{{ url_for('login') }}">

                                Login Here

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <p class="mb-0">

            © 2026 FarmersCam | AI Crop Disease Detection

        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
