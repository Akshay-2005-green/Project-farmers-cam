<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FarmersCam</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#eef8ee;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#198754;
        }

        .navbar-brand{
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .navbar-brand:hover{
            color:white;
        }

        .login-card{

            margin-top:70px;

            border:none;

            border-radius:15px;

            box-shadow:0px 5px 20px rgba(0,0,0,.15);

        }

        .card-header{

            background:#198754;

            color:white;

            text-align:center;

            font-size:28px;

            font-weight:bold;

            border-radius:15px 15px 0 0;

        }

        .btn-success{

            width:100%;

            font-size:18px;

        }

        footer{

            margin-top:60px;

            background:#198754;

            color:white;

            text-align:center;

            padding:15px;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-leaf"></i>
                FarmersCam
            </a>

        </div>

    </nav>

    <!-- Login Form -->

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card login-card">

                    <div class="card-header">

                        Login

                    </div>

                    <div class="card-body p-4">

                        <form action="{{ url_for('login') }}" method="POST">

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter Email"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required>

                            </div>

                            <!-- Remember Me -->

                            <div class="form-check mb-3">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label
                                    class="form-check-label"
                                    for="remember">

                                    Remember Me

                                </label>

                            </div>

                            <!-- Login Button -->

                            <button
                                type="submit"
                                class="btn btn-success">

                                Login

                            </button>

                        </form>

                        <hr>

                        <div class="text-center">

                            <p>

                                Don't have an account?

                                <a href="{{ url_for('register') }}">

                                    Register Here

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <p class="mb-0">

            © 2026 FarmersCam | AI Crop Disease Detection

        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
